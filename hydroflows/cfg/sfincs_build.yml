# Define the steps to be executed
steps:
  - grid.create_from_region:
      res: 100.0  # model resolution [m]
      crs: utm  # model CRS (must be UTM zone)
      rotated: False  # allow a rotated grid
      region:
        geom: <region>  # placeholder for region vector file

  - elevation.create:
      elevation_list:
        - elevation: fabdem
          mask: osm_landareas

  - mask.create_active:
      include_polygon : <region>  # placeholder for region vector file
      exclude_polygon: osm_coastlines
      drop_area: 10  # drop small areas [km2]

  - mask.create_boundary:
      btype: waterlevel
      include_polygon: osm_coastlines  # add buffer on the fly
      include_polygon_buffer: 200 # buffer distance [m]

  - subgrid.create:
      elevation_list :
        - elevation: fabdem
          mask: osm_landareas
        - elevation: gebco  # add bathymetry; used to avoid extrapolation
      roughness_list:
        - lulc: esa_worldcover
      # TODO prepare river bathymetry dasaset based on grit
      # datasets_riv:
      #   - centerlines: grit
      #     manning': 0.035
      nr_subgrid_pixels: 4  # 25m resolution
      nbins: 8
      write_dep_tif: True

  - rivers.create_river_inflow:
      # Uncomment when hydromt_sfincs is next released
      # hydrography: merit_hydro
      # river_upa: 10.0  # river upstream area threshold [km2]
      # river_len: 1000
      # keep_rivers_geom: True
      # Delete when hydromt_sfincs is next released
      rivers: rivers_lin2019_v1
      river_len: 1000
      keep_rivers_geom: True
      reverse_river_geom: True # Remove when switching to hydrography
