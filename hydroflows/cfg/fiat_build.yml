# Define the steps to be executed
steps:
  - set_config:
      modeltype: geom
      method: flood.depth
      output:
        path: output

  - set_region:
      region: <region>

  - vulnerability.create:
      vulnerability_fname: jrc_curves
      vulnerability_link_fname: jrc_curves_link
      unit: m
      continent: europe

  - exposure_geoms.create:
      exposure_fname: osm_buildings
      exposure_object_type_column: building
      exposure_link_fname: osm_buildings_link
      exposure_object_type_fill: unknown

  - exposure_geoms.create_link:
      exposure_name: osm_buildings
      impact_type: damage

  - exposure_geoms.create_max_damage:
      exposure_name: osm_buildings
      impact_type: damage
      exposure_cost_table_fname: jrc_damage
      country: World

  - exposure_geoms.update_column:
      exposure_name: osm_buildings
      columns:
        - elevation
      values:
        - 0

